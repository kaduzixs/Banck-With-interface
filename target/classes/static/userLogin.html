<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kadu Bank — Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="user.css" />
</head>
<body>

<div class="cartao">

  <div class="topo">
    <div class="logo">KB</div>
    <h1>KADU BANK</h1>
  </div>

  <div class="abas">
    <div class="indicador-aba" id="indicadorAba"></div>
    <button class="aba ativa" id="abaLogin" onclick="mudarAba('login')">Entrar</button>
    <button class="aba" id="abaRegistro" onclick="mudarAba('registro')">Abrir conta</button>
  </div>

  <form class="painel ativo" id="painelLogin" onsubmit="return false;">
    <div class="campo">
      <label for="loginUser">Nome</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="seu nome de usuário">
    </div>
    <div class="campo">
      <label for="loginPass">Senha</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="botao botao-primario" onclick="login()">Entrar na conta</button>
  </form>

  <form class="painel" id="painelRegistro" onsubmit="return false;">
    <div class="campo">
      <label for="regUser">Nome</label>
      <input type="text" id="regUser" autocomplete="username" placeholder="escolha um nome de usuário">
    </div>
    <div class="campo">
      <label for="regPass">Senha</label>
      <input type="password" id="regPass" autocomplete="new-password" placeholder="mínimo de 6 caracteres">
    </div>
    <div class="campo">
      <label for="regPassConfirm">Confirmar senha</label>
      <input type="password" id="regPassConfirm" autocomplete="new-password" placeholder="repita a senha">
    </div>
    <button class="botao botao-primario" onclick="registrar()">Abrir conta</button>
  </form>

  <p id="msg" class="mensagem"></p>

</div>

<script>
  const API_BASE = '/api/user';

  function mudarAba(aba){
    const indicador = document.getElementById('indicadorAba');
    const abaLogin = document.getElementById('abaLogin');
    const abaRegistro = document.getElementById('abaRegistro');
    const painelLogin = document.getElementById('painelLogin');
    const painelRegistro = document.getElementById('painelRegistro');

    setMsg('');

    if(aba === 'login'){
      indicador.classList.remove('deslocado');
      abaLogin.classList.add('ativa');
      abaRegistro.classList.remove('ativa');
      painelLogin.classList.add('ativo');
      painelRegistro.classList.remove('ativo');
    } else {
      indicador.classList.add('deslocado');
      abaRegistro.classList.add('ativa');
      abaLogin.classList.remove('ativa');
      painelRegistro.classList.add('ativo');
      painelLogin.classList.remove('ativo');
    }
  }

  function setMsg(texto, tipo){
    const msg = document.getElementById('msg');
    msg.innerText = texto || '';
    msg.classList.remove('mensagem-sucesso');
    if(tipo === 'sucesso') msg.classList.add('mensagem-sucesso');
  }

  async function chamarApi(caminho, params){
    const body = new URLSearchParams(params);
    const res = await fetch(`${API_BASE}${caminho}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const texto = await res.text();
    return { ok: res.ok, status: res.status, texto };
  }

  async function login(){
    const userName = document.getElementById('loginUser').value.trim();
    const userPassword = document.getElementById('loginPass').value;

    if(!userName || !userPassword){
      setMsg('Preencha nome e senha.');
      return;
    }

    const { ok, status, texto } = await chamarApi('/login', { userName, userPassword });

    if(ok){
      setMsg(texto, 'sucesso');
    } 
    else if(status === 401){
      setMsg(texto || 'Nome ou senha inválidos.');
    }
    setMsg('Não foi possível entrar agora. Tente novamente.');
    
  }

  async function registrar(){
    const userName = document.getElementById('regUser').value.trim();
    const userPassword = document.getElementById('regPass').value;
    const confirmarSenha = document.getElementById('regPassConfirm').value;

    if(!userName || !userPassword || !confirmarSenha){
      setMsg('Preencha todos os campos.');
      return;
    }
    if(userPassword.length < 6){
      setMsg('A senha precisa ter ao menos 6 caracteres.');
      return;
    }
    if(userPassword !== confirmarSenha){
      setMsg('As senhas não coincidem.');
      return;
    }

    const { ok, status, texto } = await chamarApi('/register', { userName, userPassword });

    if(ok){
      setMsg(texto, 'sucesso');
      document.getElementById('painelRegistro').reset();
      setTimeout(() => mudarAba('login'), 900);
    } else if(status === 409){
      setMsg(texto || 'Esse nome já está em uso.');
    } else {
      setMsg('Não foi possível cadastrar agora. Tente novamente.');
    }
  }
</script>

</body>
</html>
